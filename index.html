<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 宇宙情书 - 全先生生日快乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            user-select: none;
            color: white;
        }
        #canvas { display: block; }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s;
        }

        .btn-start {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f0f0ff;
            padding: 18px 50px;
            border-radius: 60px;
            backdrop-filter: blur(15px);
            cursor: pointer;
            font-size: 1.2rem;
            letter-spacing: 6px;
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.1);
            transition: 0.5s;
            animation: float-btn 4s ease-in-out infinite;
        }

        @keyframes float-btn {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-15px); opacity: 1; }
        }

        #gift-box {
            display: none;
            position: fixed;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            cursor: pointer;
            z-index: 200;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 1s;
        }
        .box-body { width: 100%; height: 100%; background: #902020; border-radius: 4px; position: relative; }
        .box-lid {
            width: 110%; height: 25px; background: #b03030;
            position: absolute; top: -15px; left: -5%; border-radius: 2px;
            transition: 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .ribbon { position: absolute; background: #d4af37; z-index: 2; }
        .ribbon-v { width: 14px; height: 100%; left: 50%; transform: translateX(-50%); }
        .ribbon-h { width: 100%; height: 14px; top: 50%; transform: translateY(-50%); }

        #card {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%; max-width: 460px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 50px 120px rgba(0,0,0,0.9);
            z-index: 300;
            opacity: 0;
            transition: 1.5s cubic-bezier(0.2, 1, 0.3, 1);
            pointer-events: auto;
            color: #222;
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
</audio>
<audio id="fireworkSound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-firework-light-explosion-bomb-2868.mp3" type="audio/mpeg">
</audio>

<canvas id="canvas"></canvas>

<div class="overlay" id="ui">
    <button class="btn-start" id="startBtn">拆开生日礼物</button>
</div>

<div id="gift-box">
    <div class="box-body">
        <div class="ribbon ribbon-v"></div>
        <div class="ribbon ribbon-h"></div>
        <div class="box-lid"></div>
    </div>
</div>

<div id="card">
    <div class="text-2xl font-bold mb-5">致全先生：</div>
    <div class="line-relaxed text-gray-700">
        <p class="mb-4">在一起的第7个年头，今年想做点不一样的，全程AI制作请笑纳！</p>
        <p class="mb-4">感谢2025带我看到了更辽阔的风景和更多的可能，一路走来你成为了我的底气，感谢你的托举和爱。让我可以随时随地做真实的自己，给了我往前走的勇气。</p>
        <p class="mb-4">2026新的一年，希望我们可以一起更好的成为自己。我们不一定往高处走，也可以往四处走，去感受、探索、经历，享受生命的一切。</p>
        <p class="mb-6">希望你开心自在，平安喜乐，在平凡的日子中，彼此继续热爱！</p>
        <div class="mt-8 pt-6 border-t border-gray-100 text-right font-semibold">
            <p>永远爱你的 ——</p>
            <p class="text-gray-400 text-sm">2026.02.16</p>
            <button onclick="location.reload()" class="text-xs text-blue-500 mt-6 underline cursor-pointer">重新回味</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');
    const fwSound = document.getElementById('fireworkSound');

    let width, height, particles = [], fireworks = [], stars = [], meteors = [];
    let stage = -1; 
    let heartRot = 0;
    let heartFlowOffset = 0;
    const PARTICLE_COUNT = 60000; 

    class Particle {
        constructor() {
            this.x = Math.random() * window.innerWidth;
            this.y = -100; 
            this.destX = this.x;
            this.destY = this.y;
            this.vx = 0; this.vy = 0;
            this.size = Math.random() * 1.1 + 0.4;
            this.color = 'rgba(255,255,255,0)';
            this.acc = 0.04 + Math.random() * 0.04;
            this.friction = 0.88;
            this.isHeart = false;
            this.heartIdx = 0;
            this.heartPhase = Math.random() * Math.PI * 2;
        }
        update() {
            if (stage === -1) return;

            if (this.isHeart && stage === 2) {
                const t = (this.heartIdx / 4500) * Math.PI * 2 + heartRot;
                const flow = Math.sin(heartFlowOffset + this.heartPhase) * 6;
                const scale = Math.min(width/28, 16);
                const ox = Math.sin(heartRot * 0.4) * 40;
                
                const baseDestX = width / 2 + ox + (16 * Math.pow(Math.sin(t), 3)) * scale;
                const baseDestY = height / 2 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
                
                // 窄一点的偏移
                const thickness = (Math.random() - 0.5) * 8; 
                this.destX = baseDestX + thickness + flow;
                this.destY = baseDestY + thickness + flow;
            }

            let dx = this.destX - this.x;
            let dy = this.destY - this.y;
            this.vx += dx * this.acc;
            this.vy += dy * this.acc;
            this.vx *= this.friction;
            this.vy *= this.friction;
            this.x += this.vx;
            this.y += this.vy;
        }
        draw() {
            if (stage === -1) return;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Meteor {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * width * 1.5;
            this.y = -100;
            this.len = Math.random() * 80 + 50;
            this.speed = Math.random() * 10 + 15;
            this.alpha = 1;
        }
        update() {
            this.x -= this.speed;
            this.y += this.speed;
            if (this.x < -100 || this.y > height + 100) this.reset();
        }
        draw() {
            ctx.strokeStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.len, this.y - this.len);
            ctx.stroke();
        }
    }

    function getSketchPoints() {
        const pts = [];
        const scale = Math.min(width, height) / 450;
        const cx = width / 2 - 20, cy = height / 2 + 50;
        const wheatYellow = '#F5DEB3'; // 麦黄色

        function addSketchLine(path, color, density = 0.001) {
            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i], p2 = path[i+1];
                for (let t = 0; t < 1; t += density) {
                    pts.push({ 
                        x: cx + (p1[0] + (p2[0] - p1[0]) * t) * scale + (Math.random()-0.5)*1.2, 
                        y: cy + (p1[1] + (p2[1] - p1[1]) * t) * scale + (Math.random()-0.5)*1.2, 
                        c: color 
                    });
                }
            }
        }

        // 修改为麦黄色：头发
        addSketchLine([[-40,-130], [-25,-155], [0,-145], [-5,-125], [-40,-130]], wheatYellow); 
        addSketchLine([[-20,-125], [-20,-40]], '#ffdbac'); 
        // 修改为麦黄色：围巾
        addSketchLine([[-20,-115], [-95,-100], [-125,-40], [-100, -20]], wheatYellow); 
        
        addSketchLine([[-20,-40], [-55,-10], [-45,40]], '#ffdbac'); 
        addSketchLine([[-20,-40], [15,-10], [5,40]], '#ffdbac'); 
        const fx = 60, fy = 10;
        addSketchLine([[fx,fy], [fx+12,fy-25], [fx+25,fy-5]], '#f97316'); 
        addSketchLine([[fx+10,fy], [fx+40,fy+35], [fx+90,fy+35], [fx+120,fy-10], [fx+80,fy-30], [fx+50,fy-10]], '#f97316'); 
        addSketchLine([[fx+25,fy-5], [fx+45,fy+15]], '#f97316'); 
        return pts;
    }

    function getTextPoints(text) {
        const pts = [];
        const tCanvas = document.createElement('canvas');
        const tCtx = tCanvas.getContext('2d');
        tCanvas.width = width; tCanvas.height = height;
        tCtx.fillStyle = "white";
        tCtx.textAlign = "center";
        tCtx.font = `bold ${Math.min(width/10, 85)}px sans-serif`;
        tCtx.fillText(text, width/2, height/2);
        const data = tCtx.getImageData(0,0,width,height).data;
        for(let y=0; y<height; y+=3) { 
            for(let x=0; x<width; x+=3) {
                if(data[(y*width + x)*4 + 3] > 128) {
                    const hue = (x / width) * 360;
                    pts.push({x, y, c: `hsla(${hue}, 80%, 75%, 1)`});
                }
            }
        }
        return pts;
    }

    function switchStage(newStage) {
        stage = newStage;
        let targets = [];
        if(stage === 1) targets = getSketchPoints();
        if(stage === 2) targets = getTextPoints("HAPPY BIRTHDAY");
        if(stage === 4) { 
            const cx = width/2, cy = height/2 + 150;
            function addCakeLayer(baseRadius, heightRange, color) {
                for(let r = 0; r <= baseRadius; r += 5) {
                    const count = r * 0.8; 
                    for(let i = 0; i < count; i++) {
                        const angle = (i / count) * Math.PI * 2;
                        targets.push({
                            x: cx + Math.cos(angle) * r, 
                            y: cy + heightRange[0] + Math.sin(angle) * (r * 0.35), 
                            c: color
                        });
                        if (r === baseRadius) {
                            for (let h = heightRange[0]; h <= heightRange[1]; h += 5) {
                                targets.push({
                                    x: cx + Math.cos(angle) * r, 
                                    y: cy + h + Math.sin(angle) * (r * 0.35), 
                                    c: color
                                });
                            }
                        }
                    }
                }
            }
            addCakeLayer(200, [0, 60], '#ff85a1');    
            addCakeLayer(150, [-70, -10], '#fbb6ce'); 
            addCakeLayer(100, [-135, -80], '#ffffff'); 
            for(let y=-185; y<-135; y+=4) targets.push({x:cx, y:cy+y, c:'#ffd700'});
        }

        particles.forEach((p, i) => {
            p.isHeart = false;
            if(i < targets.length) {
                p.destX = targets[i].x; p.destY = targets[i].y;
                p.color = targets[i].c || '#fff';
            } else if(stage === 2 && i < targets.length + 4500) { 
                p.isHeart = true;
                p.heartIdx = i - targets.length;
                p.color = `hsla(${Math.random()*20 + 340}, 100%, 75%, 0.9)`;
            } else {
                const angle = Math.random() * Math.PI * 2;
                const r = width * (1.1 + Math.random()*0.6);
                p.destX = width/2 + Math.cos(angle) * r;
                p.destY = height/2 + Math.sin(angle) * r;
                p.color = `rgba(255,255,255,${Math.random()*0.15})`;
            }
        });
    }

    class Firework {
        constructor() {
            this.x = Math.random() * width;
            this.y = height;
            this.targetY = Math.random() * height * 0.45 + 50;
            this.exploded = false;
            this.velY = -15;
            this.particles = [];
            // 亮色系：亮青、亮金、鲜红、极光紫
            const hues = [180, 50, 0, 280, 120];
            this.hue = hues[Math.floor(Math.random() * hues.length)];
        }
        update() {
            if(!this.exploded) {
                this.y += this.velY; this.velY += 0.28;
                if(this.velY >= 0) {
                    this.exploded = true;
                    try { const s = fwSound.cloneNode(); s.volume = 0.2; s.play(); } catch(e){}
                    // 更大朵的粒子数
                    for(let i=0; i<180; i++) { 
                        const a = Math.random()*Math.PI*2; const s = Math.random()*10+2;
                        this.particles.push({
                            x:this.x, y:this.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, 
                            alpha:1, decay:Math.random()*0.015+0.01,
                            sparkle: Math.random() > 0.8
                        });
                    }
                }
            } else {
                this.particles.forEach(p => { 
                    p.x += p.vx; p.y += p.vy; p.vy+=0.12; p.alpha -= p.decay; 
                });
                this.particles = this.particles.filter(p => p.alpha > 0);
            }
        }
        draw() {
            if(!this.exploded) {
                ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill();
            } else {
                this.particles.forEach(p => {
                    ctx.globalAlpha = p.alpha;
                    // 闪烁效果
                    const light = p.sparkle && Math.random() > 0.5 ? 90 : 70;
                    ctx.fillStyle=`hsla(${this.hue},100%,${light}%,1)`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
        }
    }

    async function runJourney() {
        if(bgMusic.paused) bgMusic.play().catch(()=>{});
        document.getElementById('ui').style.opacity = 0;
        setTimeout(() => document.getElementById('ui').style.display='none', 1000);

        switchStage(1); 
        await new Promise(r => setTimeout(r, 6500));
        
        switchStage(2); 
        await new Promise(r => setTimeout(r, 8000));

        stage = 3; 
        const fwInterval = setInterval(() => fireworks.push(new Firework()), 800);
        await new Promise(r => setTimeout(r, 9000));
        clearInterval(fwInterval);

        switchStage(4); 
        setTimeout(() => {
            const hint = document.createElement('div');
            hint.innerHTML = "🎂 许个愿吧，点击屏幕吹灭蜡烛 🎂";
            hint.className = "btn-start";
            hint.style.cssText = "position:fixed; bottom:12%; left:50%; transform:translateX(-50%); z-index:500; font-size:16px; border-color: #ff85a1;";
            hint.onclick = () => {
                hint.remove();
                particles.forEach(p => { p.destY += height; p.acc = 0.01; p.friction = 0.96; });
                setTimeout(() => {
                    const box = document.getElementById('gift-box');
                    box.style.display = 'block';
                    setTimeout(() => box.style.opacity = 1, 100);
                }, 1600);
            };
            document.body.appendChild(hint);
        }, 3500);
    }

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = Array.from({length: PARTICLE_COUNT}, () => new Particle());
        stars = Array.from({length: 400}, () => ({ x:Math.random()*width, y:Math.random()*height, s:Math.random()*0.8, o:0 }));
        meteors = Array.from({length: 5}, () => new Meteor());
    }

    function animate() {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(0,0,width,height);

        if (stage === -1) {
            requestAnimationFrame(animate);
            return;
        }

        // 绘制星空与流星
        stars.forEach(s => {
            s.o = 0.1 + Math.abs(Math.sin(Date.now()*0.0008 + s.x))*0.7;
            ctx.globalAlpha = s.o; ctx.fillStyle="#fff";
            ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
        });
        meteors.forEach(m => { m.update(); m.draw(); });
        ctx.globalAlpha = 1;

        if(stage === 2) {
            heartRot += 0.01;
            heartFlowOffset += 0.05;
        }
        
        if(stage === 3) {
            fireworks.forEach((f, i) => { f.update(); f.draw(); if(f.exploded && f.particles.length === 0) fireworks.splice(i,1); });
        }

        particles.forEach(p => { p.update(); p.draw(); });

        if(stage === 4) { 
            const cx = width/2, cy = height/2 + 150;
            ctx.shadowBlur = 35; ctx.shadowColor = "#ffcc33";
            ctx.fillStyle = "#ffcc33";
            ctx.beginPath();
            ctx.ellipse(cx, cy - 195 + Math.sin(Date.now()*0.015)*8, 11, 24, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        requestAnimationFrame(animate);
    }

    document.getElementById('startBtn').onclick = runJourney;
    document.getElementById('gift-box').onclick = () => {
        document.querySelector('.box-lid').style.transform = 'translateY(-190px) rotate(-12deg)';
        setTimeout(() => {
            document.getElementById('gift-box').style.opacity = 0;
            const card = document.getElementById('card');
            card.style.display = 'block';
            setTimeout(() => { card.style.opacity = 1; card.style.transform = 'translate(-50%, -50%) scale(1)'; }, 100);
        }, 800);
    };

    window.onload = () => { init(); animate(); }
    window.onresize = init;
</script>
</body>
</html>
